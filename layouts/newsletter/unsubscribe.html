{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <p>Enter your email address to receive an unsubscribe link.</p>
  <form
    action="{{ .Site.Params.service_url }}/newsletter/request-unsubscribe"
    method="POST"
  >
    <input type="email" name="email" required />
    <button type="submit">Request Unsubscribe Link</button>
  </form>
</article>
{{ end }}
