{{ $page := . }}
{{ range .Site.Menus.nav }}
  {{ if $page.IsMenuCurrent "nav" . }}
  <span>{{ .Name }}</span>
  {{ else }}
      <a href="{{ .URL }}" class="{{ if $page.IsMenuCurrent "nav" . }}active{{ end }}">{{ .Name }}</a>
  {{ end }}
    <!-- <a href="{{ .URL }}" class="{{ if $page.IsMenuCurrent "nav" . }}active{{ end }}">{{ .Name }}</a> -->
{{ end }}
